services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-${AIRSEPARATOR_AI_MODEL:-gemini-3.5-flash-lite}}
      AIRSEPARATOR_AI_PROVIDER: ${AIRSEPARATOR_AI_PROVIDER:-gemini}
      AIRSEPARATOR_AI_MODEL: ${AIRSEPARATOR_AI_MODEL:-gemini-3.5-flash-lite}

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${AIRSEPARATOR_WEB_PORT:-8088}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
